function bumpStreak(effect={},title=''){if(!s)return;s.streak=s.streak||0;const bad=(effect.energy||0)<0||(effect.trust||0)<0||/^미니게임/.test(title);const good=(effect.city||[]).some(n=>n>0)||(effect.bag)||(effect.trust||0)>0||(effect.energy||0)>0||effect.miniGrade==='S'||/^S\s*·/.test(title)||/\b3\/3\b/.test(title);if(bad)s.streak=0;else if(good){s.streak++;s.maxStreak=Math.max(s.maxStreak||0,s.streak);if(s.streak===3)toastWin('🔥 3연속! 동료가 박수');if(s.streak===5)toastWin('🔥 5연속! 오늘의 MVP 후보')}}
function resultQuip(effect){const lens={0:'다음에도 교실·설치 조건이 먼저일 거예요.',1:'다음에도 라벨·현물이 수치보다 앞일 거예요.',2:'다음에도 창고에 남길 물량을 먼저 볼 거예요.',3:'다음에도 복도 같은 실제 조건을 의심할 거예요.',4:'다음에도 도면보다 발로 걸어볼 거예요.',5:'다음에도 화면보다 누르는 순서를 볼 거예요.'}[s?.dept];const spread=(effect.city||[]).filter(n=>n>0).length;if(spread>=3)return `세 시설에 골고루 올랐습니다. ${lens||''}`;if((effect.city||[]).some(n=>n>=2))return `한 시설에 힘이 실렸습니다. ${lens||''}`;if(effect.bag)return `도구함에 ${DEPTS[s.dept].perk} 쪽 메모가 들어갔습니다.`;if((effect.trust||0)>=2)return '동료 도움이 커져 다음 선택이 수월해집니다.';return lens||'같은 도시라도 부서마다 보는 포인트가 달라요.'}
function ensureAc(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac}catch{return null}}
function beep(good=false){if(!sound)return;const ctx=ensureAc();if(!ctx)return;const play=()=>{try{ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(good?640:410,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(good?960:530,ctx.currentTime+.13);g.gain.setValueAtTime(.032,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.21);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.22)}catch{}};if(ctx.state==='suspended')ctx.resume().then(play);else play()}
function ensureBgm(){if(!bgm&&typeof AUDIO_ASSETS!=='undefined'&&AUDIO_ASSETS.bgm){bgm=new Audio(AUDIO_ASSETS.bgm);bgm.loop=true;bgm.volume=.28;bgm.preload='auto'}return bgm}
function playBgm(){const a=ensureBgm();if(!a||!sound)return;a.play().catch(()=>{})}
function stopBgm(){if(!bgm)return;bgm.pause();try{bgm.currentTime=0}catch{}}
function syncSound(){const btn=$('sound');if(!btn)return;const hasBgm=typeof AUDIO_ASSETS!=='undefined'&&!!AUDIO_ASSETS.bgm;const label=sound?'소리 켜짐':'소리 꺼짐';btn.classList.toggle('sound-on',sound);btn.classList.toggle('sound-off',!sound);btn.setAttribute('aria-pressed',sound);btn.setAttribute('aria-label',label);btn.title=sound?(hasBgm?'배경 루프 + 효과음':'효과음만'):'배경·효과음 꺼짐';const t=btn.querySelector('.sound-text');if(t)t.textContent=label;const on=btn.querySelector('.icon-on'),off=btn.querySelector('.icon-off');if(on)on.hidden=!sound;if(off)off.hidden=!!sound}
function toggleSound(){sound=!sound;syncSound();if(sound){beep(true);playBgm()}else stopBgm()}

function appointment(){const d=DEPTS[s.dept];const n=s.name==='신입'?'':s.name;const ini=n?n.slice(0,1):'';$('app').innerHTML=`<section class="center screen"><div class="appointment"><div class="row space"><span class="label">PERSONNEL NOTICE / ${String(s.seed).padStart(4,'0')}</span><span class="seal">발령 완료</span></div><div class="appointment-hero">${deptHeroVisual(d)}<p class="dept-scene-note">가상 발령 배지 · ${esc(d.org)}</p><h1 class="dept-name">${d.name}</h1><p class="dept-org"><span class="label">소속 국</span> ${d.org}</p><p class="appointment-tagline">이번에는 <b>${esc(d.name)}</b> 일하는 모습을 체험합니다 · 학교·단지·문화관은 공통 배경</p></div><p class="muted dept-blurb">${d.desc}</p><div class="appointment-perks"><span class="chip">${d.perk}</span><span class="chip soft">${d.help}</span><span class="chip mini-tag">미니게임 · ${MINI_TAG[d.kind]}</span></div><blockquote class="mentor-quote"><span class="label">선배 한마디</span>${d.line}</blockquote><div class="appointment-name-block">${playerAvatarHtml(ini)}<p class="name-preview" id="name-preview">${esc(n||'신입')}</p><label class="field" for="name">명찰에 적을 이름</label><input id="name" type="text" maxlength="12" value="${esc(n)}" placeholder="별명도 좋아요" autocomplete="nickname" oninput="syncAppointmentName(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();begin()}"></div><div class="row appointment-actions"><button class="btn" onclick="begin()">첫 출근하기 →</button><button class="btn outline" onclick="reroll()" ${s.rerolled?'disabled':''}>${s.rerolled?'재추첨 사용 완료':'다시 추첨 · 한 번'}</button></div><p class="notice">30일의 프로젝트와 발령은 게임을 위한 가상 설정입니다.</p></div></section>`;setTimeout(()=>{const el=$('name');if(el)el.focus()},0)}

function render(scroll=true){home=false;setChrome(s.phase==='end'||s.phase==='appointment'||s.phase==='play'||s.phase==='result'?'focus':'home');if(s.phase==='appointment')appointment();else if(s.phase==='play')play();else if(s.phase==='result')result();else if(s.phase==='transfer')transfer();else ending();if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function apply(e={}){s.energy=clamp(s.energy+(e.energy||0),0,10);s.trust=clamp(s.trust+(e.trust||0),0,8);if(e.city)e.city.forEach((n,i)=>{const b=s.city[i];s.city[i]=clamp(s.city[i]+n,0,8);if(b<CITY_MID&&s.city[i]>=CITY_MID)toast(`${CITY_SITES[i]} — 겨우 일정 맞춤`);if(b<CITY_OK&&s.city[i]>=CITY_OK){toast(`${CITY_SITES[i]} 준비 끝`);beep(true)}});if(e.flag)s.flags[e.flag]=true;if(e.clues)e.clues.forEach(n=>{if(!s.bag.includes(n))s.bag.push(n);queueBagItem(n)});else if(e.bag&&!s.bag.includes(e.bag)){s.bag.push(e.bag);queueBagItem(e.bag)}}
function finish(title,text,effect={},source=11){if(s.phase!=='play')return;closeModal();apply(effect);s.cityPulse=sceneCityPulse({...effect,_title:title});s.log.push({step:s.step,day:DAYS[s.step],dept:s.dept,title,text,effect,source});bumpStreak(effect,title);if(s.cityPulse==='bright')toastWin('도시가 환해졌어요');else if(s.cityPulse==='dim')toast('도시 불빛이 잠깐 어두워졌어요');else if(effect.bag)toastWin(`+${effect.bag}`);else if(effect.miniGrade==='S')toastWin('한 번에 맞췄어요');else if(/^S\s*·/.test(title))toastWin('한 번에 맞췄어요');s.phase='result';save();render();beep(s.cityPulse!=='dim')}
function advance(){if(s.phase!=='result')return;if(s.pendingPack)return toast('도구함 칸에 맞춰 넣어 주세요.');s.step++;s.local=blank();if(s.step>=10)s.phase='end';else{s.phase='play';if(s.step===5)toast('후반 — 돌발 기상·기업 전화 구간');if(s.step===8)toast('개학 전 밤 — 예산 빌드 마지막 기회')}eventOpen=s.phase==='play';save();render();beep()}

function stats(){return `<div class="meters meter-panel"><div title="일이 겹치면 줄어요. 점심·쉬면 회복"><span>${METER_ENERGY}</span><b>${'●'.repeat(Math.ceil(s.energy/2))}<i>${'○'.repeat(5-Math.ceil(s.energy/2))}</i></b><small>${s.energy}/10</small></div><div title="협업·연결이 쌓일수록 일부 선택지가 열려요"><span>${METER_TRUST}</span><b>${s.trust}<small> / 8</small></b></div><p class="fine meter-legend">메인은 <b>시설 준비도</b>(학교·산업단지·문화관)입니다.</p></div>`}

 interactionHTML=content;
 const isResult=s.phase==='result',entry=s.log.at(-1);
 const playBtn=eventOpen?'선택 창 보기 →':s.step===1?'지도 펼쳐 보기':s.step===2?'미니게임 열기 →':s.step===4?'핵심 업무 열기 →':'선택하기 →';

 s.streak=s.streak||0;$('app').innerHTML=`<section class="screen compact-game">${runProgress()}${cityPower()}<div class="play-toolbar"><div><span class="label">DAY ${DAYS[s.step]||30} / 30 · ${esc(s.name)} ${streakChip()}</span><b class="dept-play-name">${esc(DEPTS[s.dept].name)}</b><small class="dept-play-org muted">${esc(DEPTS[s.dept].org)}</small><small class="dept-run-lens">${esc(DEPTS[s.dept].tag)}</small></div><div class="play-controls"><button class="btn small ${autoMode?'light':'outline'}" onclick="toggleAuto()" aria-pressed="${autoMode}">${autoMode?'Ⅱ 속전속결 멈춤':'⚡ 속전속결'}</button><label class="sr" for="pace">자동 진행 속도</label><select id="pace" onchange="setPace(this.value)"><option value="5000" ${autoDelay===5000?'selected':''}>느긋하게</option><option value="3000" ${autoDelay===3000?'selected':''}>보통</option><option value="1200" ${autoDelay===1200?'selected':''}>빠르게</option></select></div></div><div class="story-layout"><aside class="story-aside"><div class="mini-id"><div class="avatar">${esc(s.name.slice(0,1))}</div><div><h3>${esc(s.name)}</h3><small>${esc(DEPTS[s.dept].perk)} · ${esc(DEPTS[s.dept].name)}</small></div></div>${stats()}<div class="side-heading">${isResult&&s.bag.length?'나의 도구함 · 단서':'나의 도구함'}</div>${toolbagAsideHtml()}<button class="log-btn" onclick="showLog()">나의 이야기 기록 ↗</button><button class="log-btn" onclick="showSources()">조달청 탐험 노트 ↗</button></aside><div class="story-main">${mobileHud()}<div class="city-strip city-pulse-${s.cityPulse||'neutral'}"><p class="city-map-caption">선택이 쌓이는 <b>시설 준비도</b> · 각 8점 · <b>5+</b>면 준비 끝</p>${cityArt()}<div class="city-status">${CITY_SITES.map((n,i)=>`<span>${n} <b class="city-lv ${s.city[i]>=CITY_OK?'max':s.city[i]>=CITY_MID?'mid':s.city[i]>0?'on':''}">${s.city[i]}/8</b></span>`).join('')}</div><article class="paper story-preview"><div class="preview-top"><span class="chip">${isResult?'✓ 장면 완료':deptSceneKind(s.step)}</span><span class="label muted">${s.step+1} / 10</span></div>${g?`<div class="result-grade grade-${g}"><span>${g}</span><small>${gradeCaption(g,entry.effect)}</small></div>`:''}<h2>${isResult?entry.title:deptSceneTitle(s.step)}</h2>${!isResult&&deptStepHook(s.step)?`<p class="scene-dept-hook">${deptStepHook(s.step)}</p>`:''}<p class="scene-mission">${isResult?(entry.effect?.miniGrade?entry.text:resultPreviewText(entry)):sceneGoal(s.step)}</p>${isResult?`<div class="effect-chips">${effectText(entry.effect)}</div>`:''}${isResult&&s.pendingPack?packInteractHtml():''}${eventOpen&&s.phase==='play'?'<p class="popup-hint">👇 팝업에서 고르기 (닫았으면 아래 버튼)</p>':''}<div class="fixed-decisions">${isResult?`<button class="btn full pulse" onclick="advance()" ${s.pendingPack?'disabled':''}>${s.pendingPack?'도구함에 넣은 뒤 →':s.step===9?'🏁 런 요약 →':`다음 장면 → (Enter)`}</button><button class="text-button" onclick="openDetail()">장면 다시 보기</button>`:`<button class="btn full pulse" onclick="openEvent()">${playBtn}</button>`}</div></article><div class="compact-status" title="힘=바쁨, 도움=협업 · 큰 효과는 위 시설 점수"><span>힘 ${s.energy}/10 · 도움 ${s.trust}/8</span> <span>${autoMode?'속전속결 ON':'자동 저장'}</span></div></div></div></section>`;

function pauseAuto(){autoMode=false;clearTimeout(autoTimer);autoTimer=null}
function queueAuto(){clearTimeout(autoTimer);if(autoMode)autoTimer=setTimeout(()=>{autoStep();queueAuto()},autoDelay)}
function toggleAuto(){if(!s||['appointment','end'].includes(s.phase))return;autoMode=!autoMode;if(autoMode)queueAuto();else clearTimeout(autoTimer);if(s.phase==='play'||s.phase==='result')render(false);else if(s.phase==='transfer')transfer()}
function setPace(v){autoDelay=[1200,3000,5000].includes(Number(v))?Number(v):3000;if(autoMode)queueAuto()}
function autoStep(){
 if(!autoMode||!s)return;
 if(s.phase==='end'){pauseAuto();return}
 if(s.phase==='result'){autoPackPending();advance();return}
 if(s.phase==='transfer'){moveDept(random(6));return}
 if(s.phase!=='play')return;
 if(s.step===0)introChoice(['school','factory','culture'][random(3)]);
 else if(s.step===1){const left=PLACES.map((_,i)=>i).filter(i=>!s.visits.includes(i));if(s.visits.length<(s.flags.observer?3:2))visit(left[random(left.length)]);else finishField()}
 else if(s.step===4){if(s.dept===2){s.local.stock=[40,25,20];submitStock()}else if(s.dept===0){s.local.pick=[0,1,4];submitWorkKit()}else if(s.dept===1){s.local.pick=[badBox()];submitWorkInspect()}else if(s.dept===3){s.local.pick=[0,2];submitWorkTest()}else if(s.dept===4){s.local.stock=[22,20,18];submitWorkSpace()}else{s.local.order=[0,2,1];submitWorkFaq()}}else if(s.step===2){s.local.tries=2;s.local.tool=true;teamFinish()}
 else if(s.step===3)lunchChoice(random(3));
 else if(s.step===5){const choices=[2];if(s.flags.rain||s.flags.harbor)choices.push(0);if(s.bag.includes('여유 물량')||s.trust>=4)choices.push(1);crisisChoice(choices[random(choices.length)])}
 else if(s.step===6){s.local.order=[0,1,2];submitCalls()}
 else if(s.step===7)projectChoice(random(3));
 else if(s.step===8){let cost=0;s.local.pick=[];for(const i of shuffle([0,1,2,3,4])){if((!OPS[i].trust||s.trust>=OPS[i].trust)&&cost+OPS[i].cost<=opBudget()){s.local.pick.push(i);cost+=OPS[i].cost}}submitOps()}
 else if(s.step===9)finaleChoice(random(3));
}

function play(){if(s.step===0)intro();else if(s.step===1)field();else if(s.step===2)mini();else if(s.step===4)departmentWork();else if(s.step===3)lunch();else if(s.step===5)crisis();else if(s.step===6)routing();else if(s.step===7)project();else if(s.step===8)finalPlan();else finale()}
function npcLine(s){return String(s).replace(/^[^:]+:\s*/,'')}

function departmentWorkKit(){const e=DEPT_STORIES[0],sel=s.local.pick;const ok=workKitOk();shell(title(deptChip(DEPTS[0]),e[0],'설치 위치가 바뀌었습니다. 오늘 꼭 확인할 항목 3개를 골라요.')+`<div class="paper-body">${talk(workMentor(),'개학 전날이에요. 현장부터 전원·동선·안내를 다시 맞춰야 해요.')}<p class="puzzle-goal">${workStoryLead()}</p><div class="puzzle-hud"><span>선택 <b>${sel.length}/3</b></span><span>${['전원','동선','안내'].map(t=>`<i class="need ${sel.some(i=>INSTALL_ITEMS[i].t===t)?'met':''}">${t}</i>`).join('')}</span></div><div class="work-grid">${INSTALL_ITEMS.map((x,i)=>`<button type="button" class="supply ${sel.includes(i)?'selected':''}" onclick="workTogglePick(${i},3)"><strong>${x.n}</strong><small>${x.t}</small></button>`).join('')}</div><button type="button" class="btn outline small" onclick="workResetKit()">다시 고르기</button>${workFoot(ok,'submitWorkKit','kit')}</div>`)}

function workKitHint(){if(!isDeptWork())return;s.local.tool=true;s.local.feedback='전원·동선·안내 세 가지를 넣으면 됩니다. 비·협업은 빼도 돼요.';save();play()}
function submitWorkKit(){submitWorkFail(workKitOk,()=>finish(DEPT_STORIES[0][0],`체크: ${s.local.pick.map(i=>INSTALL_ITEMS[i].n).join(', ')}. 설치팀과 바로 공유했습니다.`,{city:[2,0,0],energy:-1,bag:'설치 체크리스트'},DEPTS[0].source),()=>finish('설치 체크 누락','일부 항목을 빼고 진행했어요. 동료가 현장에서 다시 맞췄습니다.',{city:[1,0,0],energy:-2,trust:-1,bag:'설치 체크리스트'},DEPTS[0].source))}
function manifestBad(){return badBox()}
function manifestRows(){const bad=manifestBad();return [0,1,2,3].map(i=>({id:'ABCD'[i],label:i===bad?'HS-10':'HS-20'}))}
function workInspectOk(){const b=manifestBad();return s.local.pick.length===1&&s.local.pick[0]===b}
function workToggleHold(i){if(!isDeptWork())return;const a=s.local.pick,k=a.indexOf(i);if(k>=0)a.splice(k,1);else{a.length=0;a.push(i)}save();play();beep()}
function departmentWorkInspect(){const sel=s.local.pick,ok=workInspectOk();shell(title(deptChip(DEPTS[1]),DEPT_STORIES[1][0],'납품 목록은 HS-20인데, 라벨이 다른 상자만 보류 표시하세요.')+`<div class="paper-body">${talk(workMentor(),'포장은 멀쩡해도 기록이 어긋나면 멈춰야 해요.')}<p class="puzzle-goal">${workStoryLead()}</p><div class="puzzle-hud"><span>보류 <b>${sel.length}</b></span><span>계약 모델 <b>HS-20</b></span></div><div class="work-table">${manifestRows().map((r,i)=>`<button type="button" class="work-row ${sel.includes(i)?'hold':''}" onclick="workToggleHold(${i})"><span>${r.id}번</span><strong>라벨 ${r.label}</strong><small>${sel.includes(i)?'⏸ 보류':'탭하여 보류'}</small></button>`).join('')}</div><button type="button" class="btn outline small" onclick="workResetInspect()">표시 지우기</button>${workFoot(ok,'submitWorkInspect','inspect')}</div>`)}

function workInspectHint(){s.local.tool=true;s.local.feedback=`${'ABCD'[manifestBad()]}번만 라벨이 달라요. 그 상자만 보류.`;save();play()}
function submitWorkInspect(){submitWorkFail(workInspectOk,()=>{const i=s.local.pick[0];finish(DEPT_STORIES[1][0],`${'ABCD'[i]}번 상자만 보류했습니다. 나머지는 통과 처리 예정입니다.`,{city:[1,0,0],energy:-1,bag:'보류 라벨 목록'},DEPTS[1].source)},()=>finish('라벨 보류 실수','보류 표시가 어긋났어요. 동료가 목록을 다시 대조했습니다.',{city:[0,0,0],energy:-2,trust:-1,bag:'검사 재대조 메모'},DEPTS[1].source))}
function departmentWorkStock(){return departmentStock()}
function workTestOk(){return s.local.pick.length===2&&s.local.pick.includes(0)&&s.local.pick.includes(2)}
function departmentWorkTest(){const ok=workTestOk();shell(title(deptChip(DEPTS[3]),DEPT_STORIES[3][0],'복도 문제를 재현할 시험 두 가지를 고릅니다.')+`<div class="paper-body paper-body-test">${talk(2,'실험실 보고서만으론 부족해요. 복도에서 실제로 터진 조건부터 다시 넣어야 해요.')}<div class="puzzle-hud"><span>선택 <b>${s.local.pick.length}/2</b></span></div>${testPickGrid('workPickTest')}${workFoot(ok,'submitWorkTest','test')}</div>`)}
function workPickTest(i){if(!isDeptWork())return;const a=s.local.pick,k=a.indexOf(i);if(k>=0)a.splice(k,1);else{if(a.length>=2)return toast('시험은 두 가지만 골라요.');a.push(i)}save();play();beep()}
function submitWorkTest(){submitWorkFail(workTestOk,()=>finish(DEPT_STORIES[3][0],'어두운 복도·짐 든 사람 조건을 다음 시험 일정에 넣었습니다.',{city:[0,0,2],energy:-1,bag:'복도 시험 일정'},DEPTS[3].source),()=>finish('시험 조건 누락','복도 조건을 빼먹었어요. 동료가 일정을 다시 잡았습니다.',{city:[0,0,1],energy:-2,trust:-1},DEPTS[3].source))}
const SPACE_TOTAL=60,SPACE_MIN=[22,20,18],SPACE_ZONES=['입구 대기','복도 유도','매표 근처'];
function workSpaceSum(){return(s.local.stock||[0,0,0]).reduce((a,b)=>a+b,0)}
function workSpaceOk(){const st=s.local.stock||[0,0,0];return st.every((v,i)=>v>=SPACE_MIN[i])&&workSpaceSum()===SPACE_TOTAL}
function workSpaceChecks(){const st=s.local.stock||[0,0,0];return SPACE_ZONES.map((n,i)=>({ok:st[i]>=SPACE_MIN[i],label:`${n} ${st[i]}/${SPACE_MIN[i]}㎡`}))}
function departmentWorkSpace(){if(!s.local.stock)s.local.stock=[20,20,20];const sum=workSpaceSum(),ok=workSpaceOk(),checks=workSpaceChecks();shell(title(deptChip(DEPTS[4]),DEPT_STORIES[4][0],`대기 공간 ${SPACE_TOTAL}㎡를 세 구역에 나눕니다.`) +`<div class="paper-body">${talk(0,'도면상 대기 면적이 빠듯해요. 숫자부터 맞춰 볼게요.')}<p class="puzzle-goal">${workStoryLead()}</p><div class="puzzle-hud stock-hud"><span>합계 <b class="${sum===SPACE_TOTAL?'':'path-over'}">${sum}/${SPACE_TOTAL}㎡</b></span></div><ul class="stock-checks">${checks.map(x=>`<li class="${x.ok?'ok':'bad'}">${x.ok?'✓':'○'} ${x.label}</li>`).join('')}</ul><div class="stock-rows">${SPACE_ZONES.map((name,i)=>`<div class="stock-row"><strong>${name}</strong><div class="stock-stepper"><button type="button" class="btn outline small" onclick="tweakWorkSpace(${i},-2)">−2</button><b>${s.local.stock[i]}</b><button type="button" class="btn outline small" onclick="tweakWorkSpace(${i},2)">+2</button></div></div>`).join('')}</div>${workFoot(ok,'submitWorkSpace','space')}</div>`)}
function tweakWorkSpace(i,d){if(!isDeptWork())return;s.local.stock??=[20,20,20];const n=s.local.stock[i]+d;if(n<0)return;const sum=s.local.stock.reduce((x,v,j)=>x+v+(j===i?d:0),0);if(sum>SPACE_TOTAL)return toast(`${SPACE_TOTAL}㎡를 넘을 수 없어요`);s.local.stock[i]=n;save();play();beep()}
function workSpaceHint(){s.local.feedback='예: 22 · 20 · 18 = 60. 입구를 가장 넓게.';s.local.tool=true;save();play()}
function submitWorkSpace(){submitWorkFail(workSpaceOk,()=>{const st=s.local.stock;finish(DEPT_STORIES[4][0],`대기 공간 ${st.join('/') }㎡로 재배치안을 넣었습니다.`,{city:[0,0,2],energy:-1,bag:'대기 면적 스케치'},DEPTS[4].source)},()=>finish('면적 배치 미달','최소 면적에 못 미쳤어요. 동료가 도면을 다시 잡았습니다.',{city:[0,0,1],energy:-2,trust:-1,bag:'대기 면적 메모'},DEPTS[4].source))}
const FAQ_ITEMS=[{q:'버튼이 너무 많아요',hint:'먼저 들어야 해요',a:0},{q:'예약 취소가 안 돼요',hint:'고친 뒤 확인',a:2},{q:'어디를 눌러야 하나요',hint:'작은 시제품',a:1}];
const FAQ_PHASES=['불편 듣기','작은 시제품','고친 뒤 확인'];
function workFaqOk(){return Array.isArray(s.local.order)&&FAQ_ITEMS.every((x,i)=>s.local.order[i]===x.a)}
function assignFaqClear(i){if(!isDeptWork())return;s.local.order??=[];while(s.local.order.length<3)s.local.order.push(null);s.local.order[i]=null;save();play()}
function assignFaq(i,p){if(!isDeptWork())return;s.local.order??=[];while(s.local.order.length<3)s.local.order.push(null);s.local.order[i]=Number(p);save();play();beep()}
function departmentWorkFaq(){const ord=s.local.order||[],ok=workFaqOk();shell(title(deptChip(DEPTS[5]),DEPT_STORIES[5][0],'똑같은 문의 세 건 — 처리 단계에 맞게 배치하세요.')+`<div class="paper-body">${talk(1,'예약 첫날엔 화면보다 질문 종류가 먼저예요.')}<p class="puzzle-goal">${workStoryLead()}</p><div class="calls">${FAQ_ITEMS.map((f,i)=>{const p=ord[i];return `<div class="call-card ${Number.isInteger(p)?'call-done':''}"><span class="label">문의 0${i+1}</span><p>${f.q}</p>${Number.isInteger(p)?`<p class="call-picked">→ <b>${FAQ_PHASES[p]}</b> <button type="button" class="text-button" onclick="assignFaqClear(${i})">바꾸기</button></p>`:`<div class="desk-pick">${FAQ_PHASES.map((ph,k)=>`<button type="button" class="story-choice small-desk" onclick="assignFaq(${i},${k})"><span>${ph}</span></button>`).join('')}</div>`}</div>`}).join('')}</div>${workFoot(ok,'submitWorkFaq','faq')}</div>`)}
function submitWorkFaq(){submitWorkFail(workFaqOk,()=>finish(DEPT_STORIES[5][0],'세 문의를 듣기→시제→확인 흐름에 맞게 나눴습니다.',{city:[0,0,2],trust:2,energy:-1,bag:'FAQ 분류표'},DEPTS[5].source),()=>finish('문의 분류 어긋남','순서가 뒤섞였어요. 동료가 접수 화면을 다시 정리했습니다.',{city:[0,0,1],trust:-1,energy:-2},DEPTS[5].source))}
const STOCK_TOTAL=100,STOCK_RESERVE=15,STOCK_ALLOC=STOCK_TOTAL-STOCK_RESERVE;
const STOCK_SITES=['A공장 (급함)','B공장','학교 예비'];
function stockRemainder(){const st=s.local.stock;if(!st)return STOCK_TOTAL;return STOCK_TOTAL-st.reduce((a,b)=>a+b,0)}
function stockChecks(){const [a,b,c]=s.local.stock||[0,0,0],rem=stockRemainder();return [{ok:a>=40,label:`A공장 ${a}/40 이상`},{ok:b>=25,label:`B공장 ${b}/25 이상`},{ok:c>=10,label:`학교 ${c}/10 이상`},{ok:rem>=STOCK_RESERVE,label:`창고 비축 ${rem}/${STOCK_RESERVE} 이상`}]}
function stockOk(){return stockChecks().every(x=>x.ok)}
function stockIssueText(){return stockChecks().filter(x=>!x.ok).map(x=>x.label).join(' · ')}
function departmentStock(){if(!s.local.stock)s.local.stock=[40,25,20];const [a,b,c]=s.local.stock,sum=a+b+c,rem=stockRemainder(),ok=stockOk(),checks=stockChecks();shell(title(deptChip(DEPTS[s.dept]),'제한 시간 14일',`총 ${STOCK_TOTAL} 중 <b>${STOCK_ALLOC}</b>만 나눠 보내고, <b>${STOCK_RESERVE}</b>는 창고에 남깁니다.`) +`<div class="paper-body">${talk(0,'두 공장 납기가 겹쳤어요. 표에 숫자부터 맞춰 둘게요.')}<p class="hint">100을 전부 쓰는 게 아니에요. <b>85 배분 + 창고 15</b>가 맞는 상태입니다.</p><div class="puzzle-hud stock-hud"><span>배분 <b class="${sum===STOCK_ALLOC?'':'path-over'}">${sum}/${STOCK_ALLOC}</b></span><span>창고 <b class="${rem>=STOCK_RESERVE?'':'path-over'}">${rem}</b></span><span>${ok?'✓ 확정 가능':'조건 미충족'}</span></div><ul class="stock-checks">${checks.map(x=>`<li class="${x.ok?'ok':'bad'}">${x.ok?'✓':'○'} ${x.label}</li>`).join('')}</ul><div class="stock-rows">${STOCK_SITES.map((name,i)=>`<div class="stock-row"><strong>${name}</strong><div class="stock-stepper"><button type="button" class="btn outline small" onclick="tweakStock(${i},-5)">−5</button><b>${s.local.stock[i]}</b><button type="button" class="btn outline small" onclick="tweakStock(${i},5)">+5</button></div></div>`).join('')}</div>${s.local.feedback?`<div class="feedback puzzle-feedback" role="status">${s.local.feedback}</div>`:''}<div class="row"><button class="btn outline small" onclick="resetStock()">처음으로</button><button class="btn outline small" onclick="stockHint()">배분 힌트</button></div><button class="btn full" onclick="submitStock()">${ok?'이 배분으로 확정 →':'이대로 확정 (틀리면 재시도·동료 마무리)'}</button><p class="hint">맞추기 어려우면 그래도 누를 수 있어요. 두 번 틀리면 동료가 손봅니다.</p></div>`)}
function tweakStock(i,d){if(s.step!==4||s.phase!=='play')return;s.local.stock??=[40,25,20];const n=s.local.stock[i]+d;if(n<0)return;const sum=s.local.stock.reduce((x,v,j)=>x+v+(j===i?d:0),0);if(sum>STOCK_ALLOC)return toast(`배분은 ${STOCK_ALLOC}까지예요. 창고에 ${STOCK_RESERVE}는 남겨야 해요.`);s.local.stock[i]=n;save();play();beep()}
function resetStock(){if(s.step!==4)return;s.local.stock=[40,25,20];s.local.feedback='';save();play()}
function stockHint(){if(s.step!==4)return;s.local.tool=true;s.local.feedback='예: A 40 · B 25 · 학교 20 → 창고 15. 급한 A를 채운 뒤 B·학교를 맞추면 됩니다.';save();play()}
function submitStock(){if(s.step!==4||s.phase!=='play')return;if(stockOk()){const [a,b,c]=s.local.stock;finish('14일 안 물량 배분',`A공장 ${a} · B공장 ${b} · 학교 예비 ${c} · 창고 ${STOCK_RESERVE}. 급한 곳부터 차례대로 보냈습니다.`,{city:[0,2,0],energy:-1,bag:'배분 표'},DEPTS[2].source);return}s.local.tries=(s.local.tries||0)+1;if(s.local.tries<2){s.local.feedback=`✕ ${stockIssueText()} — 한 번 더 맞춰 보세요.`;save();play();beep();return}finish('창고 비축이 부족했습니다',`${stockIssueText()}. 동료가 창고·공장 일정을 급히 다시 맞췄습니다.`,{city:[0,1,0],energy:-2,trust:-1,bag:'배분 표'},DEPTS[2].source)}

function miniIntro(k){return {kit:'운동장에 보낼 물건을 예산 안에서 고릅니다.',inspect:'상자 라벨을 열어 계약 모델과 맞는지 확인합니다.',route:'창고에서 공장까지 막힌 구간을 피해 경로를 잇습니다.',test:'복도 문제를 재현할 시험 두 가지를 고릅니다.',path:'입구에서 홀까지 10칸 이내, 기둥을 피해 동선을 잇습니다.',order:'예약 화면 수정 순서를 맞춥니다.'}[k]}
function miniFailRules(){return s.local.tries?s.local.tries<2?'<p class="hint">한 번 더 시도할 수 있어요. 두 번째 실패 시 동료가 마무리합니다.</p>':'':''}
function miniHintBtn(){return s.local.tries?`<button class="log-btn" onclick="puzzleHint()">다시 시도 — 정답 힌트 보기</button>`:''}
function mini(){const d=DEPTS[departmentForMini()];const partner=s.step===4&&s.dept===s.first;let content='';if(d.kind==='kit')content=kit();if(d.kind==='inspect')content=inspect();if(d.kind==='route')content=route();if(d.kind==='test')content=testLab();if(d.kind==='path')content=pathGame();if(d.kind==='order')content=orderGame();const bodyCls=d.kind==='test'?'paper-body paper-body-test':'';shell(title(partner?'협업 퍼즐':`${MINI_TAG[d.kind]}`,miniTitle(d.kind),partner?'옆 부서 부탁':'맞히면 한 번에 통과')+`<div class="${bodyCls||'paper-body'}"><p class="puzzle-goal puzzle-goal-prominent">${miniIntro(d.kind)}</p>${content}${s.local.feedback?`<div class="feedback puzzle-feedback" role="status">${s.local.feedback}</div>`:''}${miniFailRules()}${miniHintBtn()}${s.local.tries>=2?'<button class="btn outline small" onclick="teamFinish()">동료 합동 마무리 →</button>':''}</div>`)}
function miniTitle(k){return {kit:'개학 전날, 운동장 안내',inspect:'상자 라벨이 하나 이상해요',route:'다리가 잠기기 전에',test:'실험실 OK, 복도에서 문제',path:'이 길로 들어갈 수 있을까요',order:'예약 화면, 어디부터 고칠까요'}[k]}
const SUPPLIES=[{name:'방수 덮개',cost:2,tags:['비'],icon:'☂'},{name:'보조 전원',cost:3,tags:['전원'],icon:'ϟ'},{name:'안내 스피커',cost:2,tags:['안내'],icon:'◖'},{name:'대형 화면',cost:5,tags:['안내'],icon:'▣'},{name:'장식 조명',cost:2,tags:['장식'],icon:'✧'},{name:'다기능 안내함',cost:4,tags:['안내','비'],icon:'▤'}];
function kit(){const items=s.local.pick.map(i=>SUPPLIES[i]),cost=items.reduce((a,b)=>a+b.cost,0);return `${talk(2,'개학 전 운동장 안내 — 비·전원·방송 세 가지 다 필요해요. 예산 7.')}<div class="puzzle-hud"><span>예산 <b>${cost}/7</b></span><span>품목 <b>${items.length}/3</b></span><span>${['비','전원','안내'].map(x=>`<i class="need ${items.some(v=>v.tags.includes(x))?'met':''}">${x}</i>`).join('')}</span></div><div class="supply-grid">${SUPPLIES.map((x,i)=>{const sel=s.local.pick.includes(i),over=!sel&&cost+SUPPLIES[i].cost>7;return `<button class="supply ${sel?'selected':''}" aria-pressed="${sel}" onclick="pick(${i},3,7)" ${over?'disabled':''}><b>${SUPPLIES[i].icon}</b><strong>${SUPPLIES[i].name}</strong><small>${SUPPLIES[i].tags.join(' · ')} · ${SUPPLIES[i].cost}</small></button>`}).join('')}</div><button class="btn full" onclick="checkMini()">이렇게 보내기 →</button><p class="hint">이야기용 예산이에요. 실제 조달 절차와는 다릅니다.</p>`}

function routeTileHtml(i,opts){const b=opts.blocks,blocked=b.includes(i),active=s.local.path.includes(i),current=i===s.local.path.at(-1);return `<div role="button" tabindex="${blocked?'-1':'0'}" class="route-tile ${blocked?'blocked':''} ${active?'active':''} ${current?'current':''}" data-cell="${i}" onclick="walk(${i})" onkeydown="if(!event.target.classList.contains('blocked')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();walk(${i})}" aria-label="칸 ${i}">${opts.render(i,{blocked,active,current})}</div>`}

const ORDER=['불편한 점 먼저 듣기','작은 시제품 만들기','같이 써 보기','고친 뒤 확인하기'];
function orderGame(){return `${talk(1,'예약 화면엔 버튼만 많고, 어르신들은 어디 누를지 모르겠대요. 고치는 순서를 다시 맞춰 볼까요?')}<div class="sequence">${[0,1,2,3].map((_,i)=>`<div class="seq-slot"><b>${i+1}</b><span>${s.local.order[i]!==undefined?ORDER[s.local.order[i]]:'다음에 올 일'}</span></div>`).join('')}</div><div class="choice-stack">${[2,0,3,1].map(i=>`<button class="story-choice" onclick="orderPick(${i})" ${s.local.order.includes(i)?'disabled':''}><span>${ORDER[i]}</span><b>＋</b></button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn outline small" onclick="resetPuzzle()">순서 비우기</button><button class="btn" onclick="checkMini()" ${s.local.order.length!==4?'disabled':''}>이 순서로 진행 →</button></div><p class="hint">순서만 맞춰 보는 일이에요. 실제 계약 절차랑은 달라요.</p>`}

function pick(i,max,budget=0){if(s.phase!=='play')return;const a=s.local.pick,k=a.indexOf(i);if(k>=0){a.splice(k,1);save();play();beep();return}if(a.length>=max)return toast(`최대 ${max}개까지 선택할 수 있어요. 먼저 하나를 빼 주세요.`);if(budget){const costs=s.step===2&&DEPTS[departmentForMini()].kind==='kit'?SUPPLIES.map(x=>x.cost):OPS.map(x=>x.cost);const spent=a.reduce((x,j)=>x+costs[j],0);if(spent+costs[i]>budget)return toast(`예산 ${budget}까지예요. 다른 항목을 빼거나 더 가벼운 걸 골라 주세요.`)}a.push(i);save();play();beep()}
function pathPuzzleConfig(){const k=DEPTS[departmentForMini()].kind;if(k==='route')return {blocks:BLOCKS,n:16,cols:4,start:0,maxLen:99};if(k==='path')return {blocks:PLAN_PUZZLE.blocks,n:planGoal()+1,cols:PLAN_PUZZLE.cols,start:PLAN_PUZZLE.start,maxLen:PLAN_PUZZLE.maxLen};return null}
function stepPathCell(i,quiet){if(!isMini())return false;const cfg=pathPuzzleConfig();if(!cfg)return false;const {blocks,n,cols,start,maxLen}=cfg,a=s.local.path;if(i<0||i>=n||blocks.includes(i))return false;if(!a.length){if(i!==start)return quiet?false:(toast('입구에서 시작해 주세요.'),false);a.push(i);return true}const prev=a.at(-1);if(a.length>1&&i===a.at(-2)){a.pop();return true}if(a.includes(i))return false;if(Math.abs(Math.floor(i/cols)-Math.floor(prev/cols))+Math.abs(i%cols-prev%cols)!==1)return quiet?false:(toast('바로 옆 칸만 이을 수 있어요.'),false);a.push(i);if(a.length>maxLen){a.pop();return quiet?false:(toast('10칸을 넘을 수 없어요. 다시 그려 주세요.'),false)}return true}

function deptCalls(){return deptProf().routeCalls}
function callClueWord(c){const s=c.say;if(/나라장터|벤처나라/.test(s))return '나라장터';if(/길잡이/.test(s))return '길잡이';if(/G-PASS/.test(s))return 'G-PASS';if(/벤처|등록/.test(s))return '벤처나라';if(/상담|절차|제도|비축|용역|검사 서류/.test(s))return '길잡이 상담';if(/해외|수출|국내 실적|국외/.test(s))return '해외 진출';return DESK_EXAMPLES[c.answer].split(' · ')[0]}
function callSayHtml(c){const raw=c.say,escSay=esc(raw);let html=escSay;for(const w of['G-PASS','나라장터','벤처나라','길잡이','상담 예약','비축물자','해외']){if(raw.includes(w)){html=html.replace(esc(w),`<mark class="call-key">${esc(w)}</mark>`);break}}return `<p class="call-say">${html}</p><p class="call-clue">굵은 말이 안내표 <b>예시</b>와 겹치면 그 창구예요</p>`}
function deskLegendHtml(){return `<div class="desk-legend"><span class="label">오늘 쓰는 창구 안내표</span><div class="desk-legend-grid">${DESK_SHORT.map((sh,i)=>`<div class="desk-legend-card"><span class="desk-id">${i+1}</span><strong>${DESK_NOTE[i]}</strong><small>${sh}</small><em>예: ${DESK_EXAMPLES[i]}</em></div>`).join('')}</div></div>`}
function routingAt(){const calls=deptCalls(),o=s.local.order||[];if(Number.isInteger(s.local.editCall))return s.local.editCall;for(let i=0;i<calls.length;i++)if(!Number.isInteger(o[i]))return i;return -1}
function routingDoneChips(calls){return `<div class="routing-done">${calls.map((c,i)=>{const j=s.local.order[i];if(!Number.isInteger(j))return'';return `<button type="button" class="routing-chip" onclick="editCall(${i})"><span>전화 ${i+1}</span><b>${DESK_SHORT[j]}</b></button>`}).join('')}</div>`}
function routingWizardHtml(p){const calls=deptCalls(),at=routingAt(),picked=calls.filter((c,i)=>Number.isInteger(s.local.order[i])).length;if(at>=0){const c=calls[at];return `<p class="puzzle-hud call-hud"><span>연결 <b>${at+1} / 3</b></span><span>${picked?`확인됨 ${picked}건`:''}</span></p>${picked?routingDoneChips(calls):''}<div class="call-card call-active"><span class="label">지금 받는 전화</span><h3>${c.name}</h3>${callSayHtml(c)}</div><p class="hint routing-hint">아래 ①·②·③ 중 하나만 고르세요. (위 안내표 참고)</p><div class="desk-pick desk-pick-big">${DESK_SHORT.map((sh,k)=>`<button type="button" class="story-choice small-desk" onclick="assignCall(${at},${k})"><span>${sh}</span><small>${DESK_EXAMPLES[k]}</small></button>`).join('')}</div>`}return `<p class="puzzle-hud call-hud"><span>연결 <b>3 / 3</b></span><span>마무리만 남았어요</span></p><div class="routing-review"><span class="label">연결 요약</span>${calls.map((c,i)=>{const j=s.local.order[i];return `<div class="call-card call-done"><span class="label">전화 ${i+1}</span><h3>${c.name}</h3><p class="call-say">${c.say}</p><p class="call-picked">→ <b>${DESK_SHORT[j]}</b> <button type="button" class="text-button" onclick="editCall(${i})">고치기</button></p></div>`}).join('')}</div>`}
function routing(){const p=deptProf();shell(title(deptChip(DEPTS[s.dept]),p.routeTitle,'전화 3건 · 안내표에 맞게 연결')+`<div class="paper-body routing-body routing-wizard"><p class="puzzle-goal">${p.routeDesc} 제도 이름을 외울 필요 없어요. <b>전화 문장</b>과 안내표 <b>예시</b>만 맞추면 됩니다.</p>${deskLegendHtml()}${talk(0,p.routeTalk)}${routingWizardHtml(p)}${routingAt()<0?`<button class="btn full pulse" onclick="submitCalls()">연결 마무리 →</button>`:''}</div>`)}
function editCall(i){if(s.step!==6||s.phase!=='play')return;s.local.editCall=i;save();play()}

function submitCalls(){if(s.step!==6||s.phase!=='play')return;const calls=deptCalls();if(calls.some((c,i)=>!Number.isInteger(s.local.order[i])))return toast('세 통화 모두 창구를 골라 주세요');const correct=calls.filter((c,i)=>c.answer===s.local.order[i]).length;const missed=3-correct;const detail=calls.map((c,i)=>{const hit=s.local.order[i]===c.answer;return hit?`${c.name} → ${DESK_SHORT[c.answer]}`:`${c.name} → ${DESK_SHORT[s.local.order[i]]} (동료가 ${DESK_SHORT[c.answer]}로 넘겼습니다)`}).join(' ');const city=correct===3?[1,1,1]:correct>=2?[0,1,0]:correct===1?[1,0,0]:[0,0,0];const tail=correct===3?' 세 곳 다 맞게 연결했어요.':correct>=2?' 대부분 맞았고, 나머지는 동료가 받았어요.':correct===1?' 한 통은 맞았어요. 동료가 나머지를 돌렸습니다.':' 동료가 창구를 다시 연결해 줬어요.';if(correct===3)toastWin('세 건 모두 연결');else if(correct>=2)toast('대체로 연결됐어요');finish(correct===3?'창구 연결 완료':`창구 연결 ${correct}/3`,detail+tail,{energy:correct===3?0:-Math.min(1,missed),trust:correct>=2?1:correct?0:-1,city,flag:correct>=2?'callsComplete':undefined,bag:correct>=1?'기업 지원 지도':undefined},10)}
function project(){const p=deptProf(),daysLeft=30-DAYS[s.step],schoolPrep=s.bag.includes('교실 현장 메모')||s.bag.includes('우천 대비 메모')||s.flags.rain,bonus=[schoolPrep?'현장 메모 · 학교 +2, 힘 −1':'교실 조건 · 학교 +1, 힘 −1',s.flags.access?'동선 스케치 · 문화관 +2, 힘 −1':'입구 재걷기 · 문화관 +1, 힘 −1',s.bag.includes('기업 지원 지도')?'기업 지도 · 산업단지 +1, 도움 +1':'창구 안내 · 산업단지 +1, 도움 +1'];shell(title(deptChip(DEPTS[s.dept]),'보너스 프로젝트',`개학까지 ${daysLeft}일 · ${DEPTS[s.dept].tag}`)+`<div class="paper-body">${talk(2,'시간이 조금 남았어요. 한 곳만 더 손볼까요?')}<div class="choice-stack">${p.projects.map((pr,i)=>choice((i===p.projectBias?'★ ':'')+pr[0],(i===p.projectBias?'추천 · ':'')+pr[1]+' · '+bonus[i],"projectChoice("+i+")")).join('')}</div><p class="hint">★는 이 부서에서 자주 고르는 일이에요.</p></div>`)}
function projectChoice(i){const schoolPrep=s.bag.includes('교실 현장 메모')||s.bag.includes('우천 대비 메모')||s.flags.rain;const o=[['개학 앞 마지막 점검',schoolPrep?'교실 전원·운동장 안내 장비를 현장에서 다시 맞췄습니다. 비 오는 날과 개학 첫날을 함께 상정해 보완했습니다.':'선생님·설치 담당자와 조건을 다시 확인했습니다. 완벽하진 않아도 개학 날 쓸 순서가 잡혔습니다.',{city:[schoolPrep?2:1,0,0],energy:-1,flag:'schoolPrep'},0],['문화관 입구 점검',s.flags.access?'현장 동선 스케치를 다시 펼쳤습니다. 담당자와 보완 지점을 확인하자 문화관에 들어오는 길이 조금 더 넓어졌습니다.':'현장 담당자와 입구를 함께 걸었습니다. 새롭게 발견한 불편을 검토 요청에 담았습니다.',{city:[0,0,s.flags.access?2:1],energy:-1,flag:'inclusive'},4],['계약 이전에도 할 수 있는 일','작은 기업들이 필요한 상담 창구를 찾았습니다. 조달청의 일이 물건 구매 한 가지가 아니라는 것을 실감했습니다.',{city:[0,1,0],trust:1,flag:'bridge'},6]][i];if(o)finish(o[0],o[1],o[2],o[3])}
const OPS=[{name:'학교 설치팀 연결',desc:'수업 준비를 마무리',cost:2,city:[2,0,0]}, {name:'물류 공동 점검',desc:'공급 일정을 함께 조정',cost:2,city:[0,2,0]}, {name:'문화관 동선 점검',desc:'모두가 들어올 길 확인',cost:2,city:[0,0,2]}, {name:'세 곳에 운영 안내',desc:'시민에게 변경 사항 전달',cost:1,city:[1,1,1]}, {name:'동료와 합동 지원',desc:'협업으로 세 곳 보완',cost:2,city:[1,1,1],trust:4}];
function opBudget(){return 3+(s.trust>=4?1:0)+(s.energy>=5?1:0)}
function finalPlan(){const p=deptProf(),bud=opBudget(),cost=s.local.pick.reduce((a,i)=>a+OPS[i].cost,0);const nightLine=npcLine(p.nightLead)+(s.flags.friend?' 도현도 같이 표 맞출게요.':' 할 수 있는 것만 골라도 돼요.');shell(title('개학 전 밤','남은 할 일 고르기','예산 안에서 할 수 있는 만큼만 골라요.')+`<div class="paper-body">${talk(1,nightLine)}<div class="puzzle-hud"><span>할 일 예산 <b class="${cost>bud?'over-budget':''}">${cost} / ${bud}</b></span><span>${METER_TRUST} ${s.trust} · ${METER_ENERGY} ${s.energy}</span></div><div class="operation-list">${OPS.map((o,i)=>{const sel=s.local.pick.includes(i),lack=o.trust&&s.trust<o.trust,over=!sel&&cost+o.cost>bud;return `<button class="story-choice ${sel?'selected':''}" onclick="pickOp(${i})" ${lack||over?'disabled':''} aria-pressed="${sel}"><span>${sel?'✓ ':''}${p.nightOps.includes(i)?'★ ':''}${o.name}</span><small>${o.desc} · 예산 ${o.cost}${o.trust?' · 동료 도움 4 필요':''}${p.nightOps.includes(i)?' · 추천':''}</small><b>${o.cost}</b></button>`}).join('')}</div><button class="btn full" onclick="submitOps()" ${!s.local.pick.length||cost>bud?'disabled':''}>이대로 내일 준비 →</button></div>`)}
function pickOp(i){if(s.phase!=='play'||s.step!==8||!OPS[i])return;if(OPS[i].trust&&s.trust<OPS[i].trust)return;pick(i,5,opBudget())}
function submitOps(){if(s.phase!=='play'||s.step!==8)return;const cost=s.local.pick.reduce((a,i)=>a+OPS[i].cost,0);if(!s.local.pick.length||cost>opBudget())return;const city=[0,0,0];s.local.pick.forEach(i=>OPS[i].city.forEach((n,j)=>city[j]+=n));const spread=city.filter(n=>n>0).length;const tail=spread>=3?'세 곳에 골고루 썼습니다.':spread===1?'한 시설에만 힘이 쏠렸습니다.':'두 곳만 손댔습니다.';const spent=opBudget()-cost;toast(spent?`예산 ${cost}/${opBudget()} · ${spent} 남음`:'예산 풀사용');finish('개학 전 밤 할 일',`${s.local.pick.map(i=>OPS[i].name).join(', ')}. ${tail}`,{city,energy:-1},11)}
function topCity(){return s.city.indexOf(Math.max(...s.city))}

function cityLogBoost(i){return s.log.reduce((a,e)=>a+((e.effect?.city?.[i])||0),0)}
function cityTier(n){if(n>=CITY_OK)return {key:'ok',label:'준비 끝',class:'tier-ok'};if(n>=CITY_MID)return {key:'mid',label:'겨우 버팀',class:'tier-mid'};if(n>=1)return {key:'weak',label:'허술함',class:'tier-weak'};return {key:'fail',label:'막힘',class:'tier-fail'}}
const FACILITY_BEAT=[{ok:'개학 첫날 수업이 시작됐습니다.',mid:'교실 일부만 정상 개학됩니다.',weak:'개학은 했지만 전원·안내가 들쭉날쭉합니다.',fail:'학교 개학이 미뤄졌습니다.'},{ok:'공장 라인이 정상 가동됩니다.',mid:'일부 라인만 돌아갑니다.',weak:'자재 대기로 가동이 느립니다.',fail:'공장 가동이 멈춰 있습니다.'},{ok:'문화관이 개관했습니다.',mid:'부분 개관만 가능합니다.',weak:'개관은 했지만 동선·안내가 엉망입니다.',fail:'문화관 문을 열지 못했습니다.'}];

function endingVerdict(){const c=s.city,ok=c.filter(n=>n>=CITY_OK).length,top=topCity();if(ok===3)return '30일 동안 새봄학교·산업단지·모아문화관을 고르게 맞췄습니다.';if(ok===2){const lag=CITY_SITES.find((_,i)=>c[i]<CITY_OK);return lag?`세 곳 중 두 곳은 순조로웠고, ${lag}은 아직 손볼 일이 남았습니다.`:'두 곳은 일정을 맞췄습니다.';}if(ok===1&&c.filter(n=>!n).length)return `${CITY_SITES[top]}는 무리 없이 갔고, 다른 곳은 공지·일정만 겨우 맞춘 상태입니다.`;if(c.every(n=>n>=CITY_MID&&n<CITY_OK))return '세 곳 모두 돌아가긴 하지만, 어디든 빈틈이 보입니다.';if(Math.max(...c)-Math.min(...c)>=4)return `${CITY_SITES[top]}에 시간과 일이 몰렸습니다. 나머지는 뒤에 밀린 채로 끝났습니다.`;return `${CITY_SITES[top]}에 손이 가장 많이 갔습니다. 다른 두 곳은 여기저기 보완이 남았습니다.`}

function finaleChoice(i){if(s.step!==9||s.phase!=='play'||i<0||i>2)return;s.flags.focus=i;finish(['학교','공장','문화관'][i]+' 마무리',`${finalePunch(i)} ${endingClosureText()}`,{},i===0?0:i===1?2:4)}
function endingRecap(){const lines=[],fails=s.log.filter(e=>e.title==='미니게임 타임오버').length;if(s.flags.callsComplete)lines.push('기업 전화 세 건을 맞는 상담 창구로 연결했습니다.');else if(s.flags.misdirected)lines.push('창구 연결에서 다시 돌려야 한 전화가 있었습니다.');if(s.log.some(e=>e.title==='우회로 동시 대응'))lines.push('돌발 기상 때 학교·공장·문화관 일정을 한꺼번에 밀어 넣었습니다.');lines.push(fails?'퍼즐은 동료와 합동으로 마무리한 적이 있습니다.':'퍼즐은 스스로 통과했습니다.');if(s.bag.length)lines.push(`현장에서 모은 메모 ${s.bag.length}개가 도구함에 남았습니다.`);const uniq=[];for(const L of lines)if(!uniq.includes(L))uniq.push(L);return uniq.slice(0,5)}
function endingRecapHtml(){return endingRecap().map(t=>`<p>${t}</p>`).join('')}
function result(){const e=s.log.at(-1),src=SOURCES[e.source];const fin=s.step===9,g=parseGrade(e.title,e.effect);const quip=e.title==='현장 탐색 완료'||e.effect?.miniGrade?'':'<p class="result-quip">'+resultQuip(e.effect)+'</p>';const body=e.effect?.miniGrade?`<div class="story-result"><p>${e.text}</p></div>`:resultMainHtml(e);const pack=packInteractHtml();const nextDisabled=s.pendingPack;shell(title(fin?'🏁 마지막 장면':'✓ 장면 완료',e.title,'')+`<div class="paper-body">${g?`<div class="result-grade grade-${g}"><span>${g}</span><small>${gradeCaption(g,e.effect)}</small></div>`:''}${body}${pack}<div class="effect-chips">${effectText(e.effect)}</div>${quip}${fin?'':`<details class="learning"><summary>📚 조달청 한 줄 (보너스)</summary><p>${src.fact}</p><a href="${src.url}" target="_blank" rel="noopener noreferrer">${src.title} ↗</a></details>`}<button class="btn full pulse" onclick="advance()" ${nextDisabled?'disabled':''}>${nextDisabled?'도구함에 넣은 뒤 →':fin?'🏁 30일 마무리 보기 (Enter)':'다음 장면 (Enter)'}</button></div>`)}
function effectText(e){let t=[];if(e.energy)t.push({t:`${METER_ENERGY} ${e.energy>0?'+':''}${e.energy}`,ok:e.energy>=0});if(e.trust)t.push({t:`${METER_TRUST} ${e.trust>0?'+':''}${e.trust}`,ok:e.trust>=0});if(e.city)e.city.forEach((n,i)=>{if(n)t.push({t:`${['학교','산업단지','문화관'][i]} +${n}`,ok:true})});if(e.bag)t.push({t:`+ ${e.bag}`,ok:true});return t.map(x=>`<span class="chip ${x.ok?'gain':'cost'}">${esc(x.t)}</span>`).join('')}
function endTitle(){const c=s.city,ok=c.filter(n=>n>=CITY_OK).length,mid=c.filter(n=>n>=CITY_MID&&n<CITY_OK).length,top=topCity();if(ok===3)return '세 곳을 다 맞췄습니다';if(ok===1&&c.filter(n=>!n).length>=2)return `${CITY_SITES[top]} 쪽을 끝까지 밀었습니다`;if(mid>=2&&ok===0)return '세 곳 모두 버텼습니다';if(Math.max(...c)-Math.min(...c)>=4)return '한곳에 일이 몰렸습니다';if(s.flags.callsComplete&&ok>=2)return '연결까지 챙긴 30일';return '첫 30일을 마쳤습니다'}
function ending(){pauseAuto();closeModal();setChrome('focus');$('app').innerHTML=`<section class="center wide-end screen screen-end">${runProgress()}<div class="ending-heading"><span class="label">DAY 30 · 첫 30일 마침</span><h1>${esc(s.name)}님<br>${endTitle()}</h1><p>${DEPTS[s.first].name}에서 시작한 가상 이야기 · 선택 ${s.log.length}번</p></div><div class="city-strip city-strip-end">${cityArt()}</div><div class="ending-body"><span class="seal">시즌 1 마침</span><p class="ending-lead">${endingLead()}</p><span class="label">세 곳 성과</span>${endingFacilitiesHtml()}<div class="ending-recap"><span class="label">기억에 남는 일</span>${endingRecapHtml()}</div><div class="line"></div><h3>처음 발령받은 부서</h3><div class="stamp-row">${s.route.map(x=>`<div class="department-stamp"><b>${DEPTS[x.dept].icon}</b><span>${DEPTS[x.dept].name}</span><small>DAY ${x.day}</small></div>`).join('')}</div><div class="row" style="margin-top:26px"><button class="btn" onclick="newGame()">다른 부서로 다시 시작 ↗</button><button class="btn outline" onclick="downloadReport()">이야기 저장</button><button class="btn outline" onclick="showLog()">선택 다시 보기</button></div></div></section>`}
function downloadReport(){const text=`오늘부터 조달청 — 첫 발령, 그다음 이야기\n${s.name} / ${endTitle()}\n부서: ${s.route.map(x=>DEPTS[x.dept].name).join(' → ')}\n모든 사건과 수치는 가상입니다.\n\n`+s.log.map(e=>`DAY ${e.day} · ${e.title}\n${e.text}`).join('\n\n');const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='오늘부터_조달청_나의이야기.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('이야기 기록을 저장했습니다.')}
function goHome(){if(s&&!home)save();landing();window.scrollTo({top:0,behavior:'instant'})}
function showLog(){pauseAuto();modal('내 선택이 만든 이야기',s?.log?.length?`<ul class="report-list">${s.log.map(e=>`<li><span class="chip">DAY ${e.day} · ${DEPTS[e.dept].name}</span><h3 style="font-size:17px;margin-top:10px">${e.title}</h3><p>${e.text}</p></li>`).join('')}</ul>`:'<p>첫 선택부터 이곳에 이야기가 쌓입니다.</p>')}
function showSources(){pauseAuto();modal('조달청 탐험 노트',`<p>조직·업무·정책 안내를 바탕으로 소재를 구성했습니다. 사건과 인물, 부서의 협업 방식, 게임 규칙은 창작입니다.</p>${SOURCES.map(x=>`<div class="badge"><h3>${x.title}</h3><p>${x.fact}</p><a style="font-size:12px" href="${x.url}" target="_blank" rel="noopener noreferrer">공식 자료 읽기 ↗</a></div>`).join('')}<p class="fine">확인일: 2026.11.11. 공개 업무·정책 페이지 중심으로 조사했습니다. 사이트 전체나 비공개 자료를 수집했다는 의미가 아닙니다. 과거 연도 정책과 현재 절차는 구분해야 합니다.</p>`)}
function showGuide(){pauseAuto();modal('플레이 안내',`<div class="badge"><h3>이 게임은</h3><p>조달청 <b>한 부서</b> 발령으로 업무 맥락을 짧게 체험하는 <b>비공식 소개용</b> 이야기입니다. 실제 절차·권한과 다릅니다.</p></div><div class="badge"><h3>시설 준비도 (메인)</h3><p>학교·산업단지·문화관 각 8점. <b>5점+</b> 준비 끝. 선택 칩에 +숫자가 보이면 여기에 쌓입니다.</p></div><div class="badge"><h3>힘 · 동료 도움 (보조)</h3><p><b>오늘 남은 힘</b>은 바쁨(일하면 줄고 점심에 회복). <b>동료 도움</b>은 협업(높으면 돌발·밤 업무 일부가 열림).</p></div><div class="badge"><h3>부서마다 다른 체험</h3><p>DAY 6 미니·DAY 9 점심·DAY 13 업무는 발령 부서마다 다릅니다. 다시 시작하면 다른 부서를 볼 수 있어요.</p></div><div class="badge"><h3>소리</h3><p>기본 <b>꺼짐</b>. 켜면 <b>이 게임에 넣은 짧은 배경 루프</b>(mp3)가 반복되고, 선택할 때 짧은 효과음. 외부 주소 불러오지 않음. <b>새 창 ↗</b>는 크롬·엣지용.</p></div><p class="fine">자동 진행 · 로컬 저장 · 장면 끝에 조달청 탐험 노트</p><button class="btn full" onclick="closeModal()">시작할게요 →</button>`)}
function showAbout(){pauseAuto();modal('첫 발령, 그다음 이야기',`<p>조달청 <b>한 부서</b> 발령으로 “무슨 기관인지”를 짧게 알아가는 비공식 체험 게임입니다. 실제 조달청 서비스가 아니며, 공무원의 실제 권한·인사·계약 절차를 재현하지 않습니다.</p><p>게임 화면·도시 그림·사건·프로그램은 새로 제작했습니다. 사용자가 제공한 조달청 로고와 나르미·달이 이미지를 HTML에 포함했습니다. 외부 파일을 불러오지 않고 실행되며 실시간 AI 연결이나 개인정보 전송은 없습니다. 배경은 제작한 짧은 mp3 루프를 HTML에 넣었고, 클릭 효과음은 Web Audio로 생성합니다. 외부 주소에서 음원을 불러오지 않습니다. 생성형 AI를 자료 정리와 기획·코딩 보조에 활용했습니다.</p><p>이번 버전은 반복 업무를 이야기·탐색·퍼즐·관계·선택으로 교체하고 한 시즌 한 부서로 진행합니다. 이전 부서 이동 화면에 저장된 기록도 자동으로 이어집니다. 구버전 저장 기록은 삭제하지 않으며 새 이야기의 저장 공간은 별도로 사용합니다.</p><button class="btn outline" onclick="closeModal();showSources()">공식 자료와 참고 범위 확인 →</button>`)}
document.addEventListener('visibilitychange',()=>{if(!bgm||!sound)return;if(document.hidden)bgm.pause();else bgm.play().catch(()=>{})});

document.addEventListener('keydown',e=>{if(s?.phase==='result'&&!$('overlay').firstElementChild&&e.key==='Enter'){e.preventDefault();advance();return}if(!$('overlay').firstElementChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const a=Array.from($('overlay').querySelectorAll('button,a,input,select,[tabindex="0"]')).filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
